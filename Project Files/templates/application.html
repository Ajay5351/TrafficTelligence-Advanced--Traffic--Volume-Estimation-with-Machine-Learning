{% extends "base.html" %}

{% block title %}Predict Traffic - Traffic Intelligence{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/form.css') }}">
{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center mb-4">Enter Traffic Data</h2>

    <form method="POST" action="/result" class="card p-4 shadow">
        
        <div class="mb-3">
            <label for="hour" class="form-label">Hour of Day (0-23)</label>
            <input type="number" class="form-control" id="hour" name="hour" min="0" max="23" required>
        </div>

        <div class="mb-3">
            <label for="temp" class="form-label">Temperature (°C)</label>
            <input type="number" step="0.1" class="form-control" id="temp" name="temp" required>
        </div>

        <div class="mb-3">
            <label for="holiday" class="form-label">Holiday</label>
            <select class="form-select" id="holiday" name="holiday" required>
                <option value="0" selected>No</option>
                <option value="1">Yes</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="weather_main" class="form-label">Weather</label>
            <select class="form-select" id="weather_main" name="weather_main" required>
                <option value="Clear" selected>Clear</option>
                <option value="Rain">Rain</option>
                <option value="Snow">Snow</option>
                <option value="Clouds">Clouds</option>
            </select>
        </div>

        <button type="submit" class="btn btn-success w-100">Predict Traffic Volume</button>
    </form>
</div>
{% endblock %}
